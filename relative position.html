<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position property in the css</title>
    <style>
        div{
            width:300px;
            height:200px;
            border:2px solid black;
            background-color:grey;
            display:inline-block;
            color:white;
            font-size: 30px;
            padding-top: 30px;
        }
        #r1{
            position:relative;
            top:100px;
            left: 150px;
        }
        #r2{
            position:relative;
            right:50px;
        }
        #r3{
            position:relative;
            top:100px;
            right:200px;
        }
        #r4{
            position:relative;
            right:100px
        }
    </style>
</head>
<body>
    <h2>posdition property :relative element is positioned relative its normal position</h2>
    <div id="r1">position relative :right</div>
    <div id="r2">position relative :left</div>
    <div id="r3">position relative : top</div>
    <div id="r4"> position relative: bottom</div>
    
</body>
</html>
