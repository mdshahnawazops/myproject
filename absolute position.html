<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position propert in css</title>
    <link rel="stylesheet" href="absolute.css">
</head>
<body>
    <h2>absolute position is removes from document is is relative to its closest position ancestor</h2>
    <div class="main">

        <div id="ab1">absolute:top</div>
        <div id="ab2">absolute:bottom</div>
        <div id="ab3">absolute:right</div>
        <div id="ab4">absolute :left</div>
    </div>
    
</body>
