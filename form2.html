<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<fieldset>
    <legend>Enquiry form</legend>
<form method="post" action="">
    <label>Gender :</label><br>
    <input type="radio" value="male" name="Gender" placeholder="check gender"/>Male
    <br>
    <input type="radio" value="Female" name="Gender" placeholder="check gender"/>Female<br>
    <label>First Name : </label><br>
    <input type="text" pattern="[a-zA-Z]{2,20}" name="uname" placeholder="Enter the first name"/> <br>
    <label>Courses</label><br>
    <input type="checkbox"  placeholder="choose option" value="html"/>html <br>
    <input type="checkbox"  placeholder="choose option" value="css"/>css <br>
    <input type="checkbox"  placeholder="choose option" value="js"/>js<br>
    <input type="checkbox"  placeholder="choose option" value="reactjs"/>reactjs <br>
    <input type="checkbox"  placeholder="choose option" value="nodejs"/>nodejs <br>
    <input type="checkbox"  placeholder="choose option" value="expressjs"/>expressjs <br>
    <label>Last name : </label><br>
    <input type="text" placeholder="enter the last name"/><br>
    <label>Phone Number :</label><br>
    <input type="tel" pattern="[0-9]{10}" placeholder="Enter the phone number"/><br>
    <label>EmailID :</label><br>
    <input type="email" placeholder="Enter the email number" /><br>
    <label>Message :</label> <br>
    <textarea placeholder="Write your message"></textarea><br>
    <label>photo/file :</label><br>
    <input type="file" placeholder="file" id="myfile" accept="image/jpg,image/jpeg,application/pdf"/><br>
    <label>password :</label><br>
    <input type="password" placeholder="enter the password"/>
    <br>

    <button type="submit"> save</button><br>
    <input type="submit" value="Go"/>
    </fieldset>


</form>
<body>
    
</body>
</html>
