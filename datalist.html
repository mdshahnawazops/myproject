<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>optiongroup</title>
</head>
<body>
    <h2>datalist is used to provide a list of predefined options </h2>
   
    <input type ="text" list="course" />
    <datalist id="course">
        <option value="java " >
        <option value="php " >
        <option value="python " >
        <option value="js ">
        <option value="nodejs " >
        <option value="c++ " >


    </datalist><br>
    <button>save</button><br>
    <input type ="Reset" value="Reset">
    
       

    
    
</body>
</html>
